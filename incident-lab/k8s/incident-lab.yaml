apiVersion: v1
kind: Namespace
metadata:
  name: signaldeck-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: signaldeck-lab
  labels:
    app.kubernetes.io/name: inventory
    app.kubernetes.io/part-of: signaldeck-incident-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        app.kubernetes.io/name: inventory
        app.kubernetes.io/part-of: signaldeck-incident-lab
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inventory
          image: REGION-docker.pkg.dev/PROJECT_ID/signaldeck-lab/inventory:latest
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: inventory
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://signaldeck-collector.signaldeck-system.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=lab,service.namespace=signaldeck-lab
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: signaldeck-lab
spec:
  selector:
    app: inventory
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
