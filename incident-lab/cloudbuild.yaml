steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - SERVICE=checkout
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/checkout:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/checkout:latest
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - SERVICE=inventory
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/inventory:${_IMAGE_TAG}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/inventory:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/checkout:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/checkout:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/inventory:${_IMAGE_TAG}
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/inventory:latest
substitutions:
  _REGION: us-central1
  _REPOSITORY: signaldeck-lab
  _IMAGE_TAG: manual
options:
  logging: CLOUD_LOGGING_ONLY
