name: Terraform validation
on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Format check
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate
